apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api-1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-api-1.0
  template:
    metadata:
      labels:
        app: inventory-api-1.0
    spec:
      imagePullSecrets:
      - name: registry-credentials
      containers:
      - name: inventory-api
        image: registry.gitlab.com/9846381903/inventory_api:3.7
        envFrom:
        - secretRef:
            name: mysecret
        command:
        - /bin/bash
        - -c
        - python3 module.py
        imagePullPolicy: IfNotPresent
      restartPolicy: Always
---
