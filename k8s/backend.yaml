apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-controller-1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligent-controller-1.0
  template:
    metadata:
      labels:
        app: intelligent-controller-1.0
    spec:
      imagePullSecrets:
      - name: registry-credentials
      containers:
      - name: intelligent-controller
        image: registry.gitlab.com/9846381903/intelligent_controller:3.8
        envFrom:
        - secretRef:
            name: mysecret
        - secretRef:
            name: aws-secret
        - secretRef:
            name: azure-secret
        env:
        - name: API_ENDPOINT
          value: "http://inventory-api"
        - name: AWS_API_ENDPOINT
          value: "http://aws-operation"
        - name: AZURE_API_ENDPOINT
          value: "http://azure-operation"
        - name: REGISTER_API_ENDPOINT
          value: "http://rest-api"
        - name: AUTHENTICATE_API_ENDPOINT
          value: "http://rest-api"
        command:
        - /bin/bash
        - -c
        - python3 module.py
        imagePullPolicy: IfNotPresent
      restartPolicy: Always
---
