<!DOCTYPE html>
<html>
<head>
    <title>Console Page</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <h2 class="sidebar-heading">HOME</h2>
        <span id="username"></span>
        <p id="onlineStatus" class="online-status">Logged In<span class="green-symbol"></span></p>

        <a id="settingsButton" class="settings-button" href="#">Settings</a>
    </div>
    <div class="container">
        <a id="virtualMachinesButton" class="action-button top-left">Virtual Machines</a>
        <h1 class="dashboard-heading"><img src="heading.gif" alt="Cloudash"></h1>
        <div id="vmOptions" class="vm-options" style="display: none;">
            <div class="input-section">
                <input type="text" id="cpuBox" class="input-box" placeholder="CPU">
                <input type="text" id="ramBox" class="input-box" placeholder="RAM">
                <input type="text" id="sshKeyBox" class="input-box" placeholder="SSH Key">
                <a id="launchButton" class="launch-button">Launch</a>
            </div>
            <div class="button-section">
                <div id="loading" class="loading" style="display: none;"><img src="loading.gif" alt="Loading..."></div>
            </div>
        </div>
        <div class="list-wrapper">
            <div id="instanceList" class="instance-list">
                <table>
                    <tr>
                        <th>Instance ID</th>
                        <th>Public IP</th>
                        <th>Status</th>
                        <th>SSH Command</th>
                        <th>Operation</th>
                    </tr>
                </table>
                <p id="emptyListMessage" class="empty-list-message"></p>
            </div>
        </div>
        <a id="logoutButton" class="logout-button" href="../login/">Logout</a>
    </div>
    <script src="console.js"></script>
</body>
</html>
